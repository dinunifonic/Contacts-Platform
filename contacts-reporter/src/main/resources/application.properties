#Keycloak server and realm
quarkus.oidc-client.auth-server-url=http://localhost:8081/realms/contacts

#Service account client
quarkus.oidc-client.client-id=contacts-reporter
quarkus.oidc-client.credentials.secret=${REPORTER_CLIENT_SECRET}
quarkus.oidc-client.grant.type=client

#Contacts API URL
quarkus.rest-client.contacts-api.url=http://localhost:8080

#Configure contacts-reporter
quarkus.http.port=8082

#Fake secret so Quarkus can start tests
%test.quarkus.oidc-client.credentials.secret=test-only-not-a-real-secret
#Tests run on a random free port
quarkus.http.test-port=0
#Coverage: Tests write into the same JaCoCo data file
%test.quarkus.jacoco.reuse-data-file=true

#RabbitMQ incoming channel for contact-created events
mp.messaging.incoming.contact-created-in.connector=smallrye-rabbitmq
mp.messaging.incoming.contact-created-in.queue.name=contacts-reporter.contact-created
mp.messaging.incoming.contact-created-in.exchange.name=contacts.events
mp.messaging.incoming.contact-created-in.exchange.type=topic
mp.messaging.incoming.contact-created-in.routing-keys=contact.created
mp.messaging.incoming.contact-created-in.queue.declare=true
mp.messaging.incoming.contact-created-in.max-outstanding-messages=1

# Dead-letter handling for failed contact events
mp.messaging.incoming.contact-created-in.auto-bind-dlq=true
mp.messaging.incoming.contact-created-in.dead-letter-queue-name=contacts-reporter.contact-created.dlq
mp.messaging.incoming.contact-created-in.dead-letter-exchange=contacts.events.dlx
mp.messaging.incoming.contact-created-in.dead-letter-exchange-type=direct
mp.messaging.incoming.contact-created-in.dead-letter-routing-key=contacts-reporter.contact-created.dlq
mp.messaging.incoming.contact-created-in.dlx.declare=true
mp.messaging.incoming.contact-created-in.failure-strategy=reject

#Kafka incoming channel for contact-created events
mp.messaging.incoming.contact-created-kafka-in.connector=smallrye-kafka
mp.messaging.incoming.contact-created-kafka-in.topic=contacts.created
