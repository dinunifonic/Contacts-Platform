#Application
app.message=Contacts API
%dev.app.message=Contacts API - DEV
%prod.app.message=Contacts API - PROD

#Database
quarkus.datasource.db-kind=mysql
#Production database supplied through environment variables, never committed
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
#Flyway
quarkus.flyway.migrate-at-start=true
#Hibernate: Database schema must not be automatically generated
quarkus.hibernate-orm.schema-management.strategy=none

#Error handling
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.hibernate.validator.runtime.jaxrs.ResteasyReactiveViolationExceptionMapper

#Contacts Realm as Trusted Identity Provider
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/contacts}
#Tells Swagger to act like the 'contacts-frontend' Keycloak client
quarkus.swagger-ui.oauth-client-id=contacts-frontend
#Disable automatic creation of OpenAPI security scheme from Quarkus OIDC
quarkus.smallrye-openapi.auto-add-security=false
#Do not turn roles into OAuth scopes
quarkus.smallrye-openapi.auto-add-security-requirement=false
#Only accept tokens with "aud: contacts-api"
quarkus.oidc.token.audience=contacts-api
#Read roles from both locations: realm_access/roles, resource_access/contacts-api/roles
quarkus.oidc.roles.role-claim-path=realm_access/roles,resource_access/contacts-api/roles

#Tests run on a random free port
quarkus.http.test-port=0
#Coverage: Tests write into the same JaCoCo data file
%test.quarkus.jacoco.reuse-data-file=true

#RabbitMQ outgoing channel for contact-created events
mp.messaging.outgoing.contact-created-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.contact-created-out.exchange.name=contacts.events
mp.messaging.outgoing.contact-created-out.exchange.type=topic
mp.messaging.outgoing.contact-created-out.default-routing-key=contact.created

#Kafka outgoing channel for contact-created events
mp.messaging.outgoing.contact-created-kafka-out.connector=smallrye-kafka
mp.messaging.outgoing.contact-created-kafka-out.topic=contacts.created
mp.messaging.outgoing.contact-created-kafka-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
#Dev Services creates the topic with 3 partitions, so partitioning by key is meaningful
quarkus.kafka.devservices.topic-partitions."contacts.created"=3

#Include Swagger UI in the packaged prod application
quarkus.swagger-ui.always-include=true

#Enables JSON logging when the application runs with the prod profile
%prod.quarkus.log.console.json.enabled=true