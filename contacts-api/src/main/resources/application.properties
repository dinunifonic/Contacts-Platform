#Application
app.message=Contacts API
%dev.app.message=Contacts API - DEV
%prod.app.message=Contacts API - PROD

#Database
quarkus.datasource.db-kind=mysql
#Flyway
quarkus.flyway.migrate-at-start=true
#Hibernate: Database schema must not be automatically generated
quarkus.hibernate-orm.schema-management.strategy=none

#Error handling
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.hibernate.validator.runtime.jaxrs.ResteasyReactiveViolationExceptionMapper

#Contacts Realm as Trusted Identity Provider
quarkus.oidc.auth-server-url=http://localhost:8081/realms/contacts
#Tells Swagger to act like the 'contacts-frontend' Keycloak client
quarkus.swagger-ui.oauth-client-id=contacts-frontend
#Disable automatic creation of OpenAPI security scheme from Quarkus OIDC
quarkus.smallrye-openapi.auto-add-security=false
#Do not turn roles into OAuth scopes
quarkus.smallrye-openapi.auto-add-security-requirement=false
#Only accept tokens with "aud: contacts-api"
quarkus.oidc.token.audience=contacts-api