apiVersion: v1
kind: ConfigMap
metadata:
  name: contacts-reporter-config
  namespace: contacts-platform
data:
  QUARKUS_PROFILE: "prod"
  QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL: "http://keycloak:8080/realms/contacts"
  QUARKUS_REST_CLIENT_CONTACTS_API_URL: "http://contacts-api:8080"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "contacts"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
